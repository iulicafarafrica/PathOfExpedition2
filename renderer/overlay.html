<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://web.poecdn.com"
/>
<title>Path of Expedition Overlay</title>
<style>
  @font-face {
    font-family: "Norse";
    src: url("fonts/Norse.otf") format("opentype");
    font-weight: normal;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent; overflow: hidden;
    user-select: none;
  }
  /* bara cu tot randul: nume + trend% + cantitate + pret, peste joc.
     Fond aproape opac (lizibil peste orice) si latime = cat continutul
     (width: max-content), ca sa acopere cat mai putin din joc. */
  .bar {
    position: absolute; left: 0;
    display: flex; align-items: baseline; gap: 7px;
    width: max-content; max-width: calc(100% - 4px);
    font-family: var(--ui-font, "Segoe UI", Tahoma, sans-serif);
    font-size: 14px; white-space: nowrap;
    color: #ead9a8;
    background: rgba(6, 5, 4, .96);
    border: 1px solid rgba(214, 198, 156, .55);
    border-radius: 5px;
    padding: 4px 10px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .95);
    box-shadow: 0 1px 5px rgba(0, 0, 0, .7);
  }
  .bar .name {
    flex: 0 1 auto; min-width: 0; max-width: 190px;
    overflow: hidden; text-overflow: ellipsis;
    font-weight: bold;
  }
  .bar .trend { flex-shrink: 0; font-size: 11px; }
  .bar .trend.up { color: #7ee08a; }
  .bar .trend.down { color: #ff9090; }
  /* market mover: crestere mare pe 7 zile -> evidentiat, bun de vandut */
  .bar .trend.pump { color: #ffb347; font-weight: bold; }
  .bar .price { flex-shrink: 0; color: #eddfb6; }
  .bar .spark { flex-shrink: 0; }
  .bar .ico { align-self: center; width: 18px; height: 18px; flex-shrink: 0; }
  /* niveluri de valoare (praguri fixe in Divine) */
  .bar.high .name, .bar.high .price { color: #86e592; }
  .bar.high { border-color: rgba(134, 229, 146, .55); }
  .bar.top .name, .bar.top .price { color: #ffd76a; }
  .bar.top { border-color: rgba(240, 200, 90, .85); box-shadow: 0 0 7px rgba(240, 200, 90, .4); }
  .bar.unknown .price { color: #9a8760; }
  /* legenda (jos): ce inseamna sagetile si mini-graficul */
  #legend {
    position: absolute; left: 0; bottom: 3px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: max-content; max-width: calc(100% - 4px);
    font-family: var(--ui-font, "Segoe UI", Tahoma, sans-serif);
    font-size: 11px; line-height: 1.25; white-space: nowrap; color: #b7a67c;
    background: rgba(6, 5, 4, .86);
    border: 1px solid rgba(214, 198, 156, .32);
    border-radius: 5px; padding: 3px 9px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
  }
  /* display:flex de mai sus (specificitate mai mare) copleseste display:none din
     atributul [hidden] -> fara regula asta legenda nu se ascunde niciodata. */
  #legend[hidden] { display: none; }
  #legend .lg { display: flex; align-items: center; gap: 5px; }
  #legend .up { color: #7ee08a; }
  #legend .down { color: #ff9090; }
  #legend .pump { color: #ffb347; font-weight: bold; }
  #legend svg { flex-shrink: 0; }
</style>
</head>
<body>
<div id="chips"></div>
<div id="legend" hidden>
  <div class="lg"><b class="up">▲</b> <span data-i18n="ovl.legendUp">price up (7 days)</span></div>
  <div class="lg"><b class="down">▼</b> <span data-i18n="ovl.legendDown">price down (7 days)</span></div>
  <div class="lg"><b class="pump">▲</b> <span data-i18n="ovl.legendSpike">spike (big rise, 15%+)</span></div>
  <div class="lg"><svg width="26" height="12" viewBox="0 0 26 12"><polyline points="1,10 5,6 9,8 13,3 17,5 21,2 25,4" fill="none" stroke="#cbbc92" stroke-width="1.3" stroke-linejoin="round"/></svg> <span data-i18n="ovl.legendHistory">7-day price history</span></div>
</div>
<script src="locales.js"></script>
<script src="i18n.js"></script>
<script src="fontui.js"></script>
<script src="overlay.js"></script>
</body>
</html>
