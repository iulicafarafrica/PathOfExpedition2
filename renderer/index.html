<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://web.poecdn.com"
/>
<title>Path of Expedition</title>
<style>
  @font-face {
    font-family: "Norse";
    src: url("fonts/Norse.otf") format("opentype");
    font-weight: normal;
  }
  @font-face {
    font-family: "Norse";
    src: url("fonts/Norse-Bold.otf") format("opentype");
    font-weight: bold;
  }
  :root {
    --parch: #d9c9a3;
    --parch-2: #cbb890;
    --ink: #3a2c18;
    --ink-soft: #5c4a30;
    --line: #8a6f47;
    --gold: #8a6a1f;
    --green: #2f6b34;
    --btn: #c2ad82;
    --btn-hi: #d6c69c;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body {
    margin:0;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 50% 0%, #e7d9b6 0%, #cbb890 60%, #b49b6e 100%);
  }
  .wrap { padding:10px 12px; display:flex; flex-direction:column; gap:7px; min-height:100%; }
  h1 {
    font-family: "Norse", Georgia, serif;
    font-size:21px; margin:0; text-align:center; letter-spacing:.5px;
    color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .btns { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .corelbl { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:bold; }
  button, select {
    font-family:inherit; font-size:12px; font-weight:bold; color:var(--ink);
    background:linear-gradient(#d8c89e, var(--btn));
    border:1px solid var(--line); border-radius:3px;
    padding:4px 8px; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 1px 2px rgba(0,0,0,.25);
  }
  button:hover, select:hover { background:linear-gradient(#e2d4ae, var(--btn-hi)); }
  button:active { box-shadow:inset 0 1px 3px rgba(0,0,0,.35); }
  button.on { background:linear-gradient(#b7d9a0, #9cc47e); }
  .status { font-size:12px; color:var(--ink-soft); text-align:center; min-height:14px; font-style:italic; }
  .list {
    background:linear-gradient(#e0d1ad, #d3c19a);
    border:2px solid var(--line); border-radius:4px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25), 0 2px 6px rgba(0,0,0,.25);
    padding:3px 8px; min-height:70px; overflow:auto;
  }
  .row {
    display:flex; align-items:center; gap:6px; padding:3px 3px;
    border-bottom:1px solid rgba(138,111,71,.35);
  }
  .row.clickable { cursor:pointer; }
  .row.clickable:hover { background:rgba(138,111,71,.14); }
  .row:last-child { border-bottom:0; }
  .ico { flex-shrink:0; width:18px; height:18px; }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:var(--ink); }
  /* coloane cu latime FIXA ca randurile sa fie aliniate pe verticala */
  .spark { flex-shrink:0; width:46px; display:flex; justify-content:flex-end; }
  .trend { flex-shrink:0; width:52px; text-align:right; font-size:10px; }
  .trend.up { color:var(--green); }
  .trend.down { color:#8a2a2a; }
  /* market mover: crestere mare pe 7 zile -> evidentiat, bun de vandut */
  .trend.pump { color:#b25e00; font-weight:bold; }
  .qty { flex-shrink:0; width:30px; text-align:right; font-weight:bold; color:var(--ink-soft); font-size:12px; }
  .price { flex-shrink:0; width:150px; text-align:right; white-space:nowrap; font-weight:bold; font-size:13px; color:var(--gold); }
  /* niveluri de valoare (praguri fixe in Divine) */
  .row.high .name, .row.high .price { color:var(--green); }
  .row.top .name, .row.top .price { color:#9a6b00; text-shadow:0 0 6px rgba(154,107,0,.25); }
  .empty { color:var(--ink-soft); font-size:12px; font-style:italic; padding:8px 3px; }
  .err { color:#8a2a2a; font-size:12px; padding:8px 3px; }
  .spacer { flex:1; min-height:6px; }
  .footer {
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; color:var(--ink-soft);
    padding-top:6px; border-top:1px solid var(--line); margin-top:auto;
  }
  .footer a { color:var(--gold); text-decoration:none; font-weight:bold; cursor:pointer; }
  .footer a:hover { text-decoration:underline; }
  /* linkul de donatie: iese in evidenta (pastila cafea), nu doar text auriu */
  .footer a#bmc {
    color:#fff3e0;
    background:linear-gradient(#cf8f3e, #a8661e);
    border:1px solid #6d4114; border-radius:4px;
    padding:2px 9px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.25);
    text-shadow:0 1px 1px rgba(0,0,0,.35);
  }
  .footer a#bmc:hover { background:linear-gradient(#dd9f4e, #b8761e); text-decoration:none; }
  .hk { font-size:10px; color:var(--ink-soft); text-align:center; padding:3px 0 0; line-height:1.5; }
  .hk b { color:var(--ink); font-weight:bold; }
  .priceline { color:var(--ink-soft); }
  .upd-banner {
    text-align:center; font-size:12px; font-weight:bold; cursor:pointer;
    color:#7a1f1f; background:linear-gradient(#f0d9b0, #e6c896);
    border:1px solid var(--gold); border-radius:3px; padding:4px 8px;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .upd-banner:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Path of Expedition</h1>
  <div class="btns">
    <label class="corelbl">League:
      <select id="league"></select>
    </label>
    <label class="corelbl">Hide:
      <select id="minval">
        <option value="0">Off</option>
        <option value="0.01">≥0.01 div</option>
        <option value="0.1">≥0.1 div</option>
        <option value="1">≥1 div</option>
        <option value="10">≥10 div</option>
      </select>
    </label>
    <button id="sel">Select region</button>
    <button id="ovl">Overlay: OFF</button>
    <button id="snd">Alert: OFF</button>
    <button id="nm">Names: ON</button>
    <button id="scan">Scan now</button>
    <button id="ref">Refresh prices</button>
    <button id="chk">Check OCR</button>
    <button id="upd">Update</button>
    <button id="dbg">Debug</button>
  </div>
  <div id="updBanner" class="upd-banner" hidden></div>
  <div id="status" class="status">Loading…</div>
  <div id="list" class="list"><div class="empty">No prices yet.</div></div>
  <div class="spacer"></div>
  <div class="hk"><b>Ctrl+Alt+O</b> overlay · <b>Ctrl+Alt+R</b> rescan · <b>Ctrl+Alt+C</b> copy price · <b>Ctrl+Alt+T</b> item page</div>
  <div class="footer">
    <span>made by iulian.icb · <span id="ver">v—</span> · <span id="pricesTime" class="priceline">Prices updated: —</span></span>
    <a id="bmc">☕ Buy me a coffee</a>
  </div>
</div>
<script>
const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");
const leagueEl = document.getElementById("league");
const pricesTimeEl = document.getElementById("pricesTime");
const ovlBtn = document.getElementById("ovl");
const sndBtn = document.getElementById("snd");
const nmBtn = document.getElementById("nm");
const minvalEl = document.getElementById("minval");
let overlayOn = false;
let soundOn = false;
let namesOn = true;   // numele itemului in overlay (false = ascuns)
let minDiv = 0;      // prag de afisare (in Divine); 0 = arata tot
let curRows = [];
// prag pt "market mover": variatie pe 7 zile peste care marcăm itemul ca pump
const PUMP_PCT = 15;
function setOvlBtn(on) { overlayOn = on; ovlBtn.textContent = "Overlay: " + (on ? "ON" : "OFF"); ovlBtn.classList.toggle("on", on); }
function setSndBtn(on) { soundOn = on; sndBtn.textContent = "Alert: " + (on ? "ON" : "OFF"); sndBtn.classList.toggle("on", on); }
function setNmBtn(on) { namesOn = on; nmBtn.textContent = "Names: " + (on ? "ON" : "OFF"); nmBtn.classList.toggle("on", on); }

// chime scurt (doua tonuri) prin Web Audio - fara fisiere de sunet
let audioCtx = null;
function ping() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [880, 1318.5].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const s = t0 + i * 0.13;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.28, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.28);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(s); o.stop(s + 0.32);
    });
  } catch {}
}

function setPricesTime(ts, stale) {
  const suffix = stale ? " (cached — offline)" : "";
  if (!ts) { pricesTimeEl.textContent = "Prices updated: never" + suffix; return; }
  const d = new Date(ts);
  const pad = (n) => String(n).padStart(2, "0");
  const date = `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  pricesTimeEl.textContent = `Prices updated: ${date} ${time}${suffix}`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// mini-grafic 7 zile din sparkline.data (aceeasi logica precum in overlay)
function sparkSvg(data, trend) {
  if (!Array.isArray(data) || data.length < 2) return "";
  const w = 46, h = 14, p = 1.5;
  const min = Math.min(...data), max = Math.max(...data);
  const span = (max - min) || 1;
  const pts = data.map((v, i) => {
    const x = p + (i / (data.length - 1)) * (w - 2 * p);
    const y = p + (1 - (v - min) / span) * (h - 2 * p);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const col = trend === "down" ? "#8a2a2a" : trend === "up" ? "#2f6b34" : "#8a7a55";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

function render(rows, error) {
  curRows = error ? [] : rows;
  if (error) { listEl.innerHTML = `<div class="err">${esc(error)}</div>`; return; }
  // cu overlay pornit, lista dispare complet din fereastra - totul se afiseaza doar in overlay
  if (overlayOn) { listEl.innerHTML = `<div class="empty">Prices are shown in the in-game overlay.</div>`; return; }
  // prag de valoare: ascundem itemele sub minDiv (in Divine)
  const shown = rows.filter((r) => (r.totalDivine || 0) >= minDiv);
  if (!shown.length) {
    listEl.innerHTML = `<div class="empty">` + (rows.length ? "Nothing above the value threshold." : "No items yet. Open Runeshape Combinations in game.") + `</div>`;
    return;
  }
  listEl.innerHTML = shown.map((r, i) => {
    const ico = r.icon ? `<img class="ico" src="${esc(r.icon)}" alt="">` : "";
    const name = esc(r.matchedName || r.name);
    const tier = r.tier ? ` ${r.tier}` : "";
    const clickable = r.matchedName ? " clickable" : "";
    const spark = `<span class="spark">${sparkSvg(r.trendData, r.trend)}</span>`;
    let trend = '<span class="trend"></span>';
    if (r.trend === "up" || r.trend === "down") {
      const arrow = r.trend === "up" ? "▲" : "▼";
      const pct = Number.isFinite(r.trendPct) ? " " + Math.abs(r.trendPct).toFixed(1) + "%" : "";
      const pump = Number.isFinite(r.trendPct) && r.trendPct >= PUMP_PCT ? " pump" : "";
      trend = `<span class="trend ${r.trend}${pump}">${arrow}${pct}</span>`;
    }
    const price = r.display ? esc(r.display.text) : "?";
    return `<div class="row${tier}${clickable}" data-i="${i}">${ico}<span class="name">${name}</span>${spark}${trend}<span class="qty">${esc(r.qty)}x</span><span class="price">${price}</span></div>`;
  }).join("");
  // click pe un rand cu preț -> pagina itemului pe poe.ninja (volum, istoric)
  listEl.querySelectorAll(".row.clickable").forEach((el) => {
    el.addEventListener("click", () => {
      const r = shown[+el.dataset.i];
      if (r && r.matchedName) window.api.openItem({ league: leagueEl.value, category: r.category, name: r.matchedName });
    });
  });
}

leagueEl.onchange = async () => {
  statusEl.textContent = "Switching league + loading prices…";
  await window.api.setLeague(leagueEl.value);
  statusEl.textContent = "League: " + leagueEl.value;
  const cfg = await window.api.getConfig();
  setPricesTime(cfg.pricesAt, cfg.pricesStale);
  const r = await window.api.scanNow();
  render(r.rows, r.error);
};

async function boot() {
  const cfg = await window.api.getConfig();
  const leagues = cfg.availableLeagues || [];
  leagueEl.innerHTML = leagues.map(l => `<option value="${l}">${l}</option>`).join("");
  leagueEl.value = cfg.league || leagues[0] || "";
  setPricesTime(cfg.pricesAt, cfg.pricesStale);
  setOvlBtn(!!cfg.overlay);
  setSndBtn(!!cfg.soundAlert);
  setNmBtn(!cfg.hideNames);
  minDiv = cfg.minDivine || 0;
  minvalEl.value = String(minDiv);
  document.getElementById("ver").textContent = "v" + (cfg.version || "?");
  statusEl.textContent = cfg.region ? "Region set. Scanning automatically." : "Choose a region first (Select region).";
  checkUpdateNow(true); // fire-and-forget, silent
}
// re-verificam update la 30 min (un build pornit de mult timp prinde noul release)
setInterval(() => checkUpdateNow(true), 30 * 60 * 1000);

document.getElementById("sel").onclick = async () => {
  statusEl.textContent = "Drag a box over the Runeshape panel, then press Enter.";
  await window.api.selectRegion();
  statusEl.textContent = "Region saved. Scanning automatically.";
};
ovlBtn.onclick = async () => {
  const r = await window.api.toggleOverlay(!overlayOn);
  if (r.ok) {
    setOvlBtn(r.on);
    render(curRows, null);   // cu overlay ON ascundem preturile din fereastra principala
    statusEl.textContent = r.on
      ? "Overlay on — prices now show over the in-game panel."
      : "Overlay off.";
  } else {
    statusEl.textContent = "Overlay: " + (r.error || "failed");
  }
};
sndBtn.onclick = async () => {
  const r = await window.api.setSoundAlert(!soundOn);
  if (r.ok) {
    setSndBtn(r.on);
    statusEl.textContent = r.on
      ? "Sound alert on — a chime plays when a new item is 1 Divine or more."
      : "Sound alert off.";
  }
};
nmBtn.onclick = async () => {
  const r = await window.api.setHideNames(namesOn);   // namesOn=true -> ascunde numele
  if (r && r.ok) {
    setNmBtn(!r.hideNames);
    statusEl.textContent = r.hideNames
      ? "Overlay now shows prices only (names hidden)."
      : "Overlay shows item names again.";
  }
};
minvalEl.onchange = async () => {
  const r = await window.api.setMinValue(parseFloat(minvalEl.value) || 0);
  if (r && r.ok) minDiv = r.minDivine || 0;
  render(curRows, null);   // aplica pragul imediat, fara re-scan
  statusEl.textContent = minDiv > 0 ? `Hiding items below ${minDiv} div.` : "Showing all items.";
};
document.getElementById("scan").onclick = async () => {
  statusEl.textContent = "Scanning…";
  const r = await window.api.scanNow();
  render(r.rows, r.error);
  statusEl.textContent = `Done: ${r.rows.length} rows.`;
};
document.getElementById("ref").onclick = async () => {
  statusEl.textContent = "Loading prices…";
  const r = await window.api.refreshPrices();
  if (r.at) setPricesTime(r.at, r.stale);
  statusEl.textContent = r.ok
    ? (r.stale ? `poe.ninja unreachable — showing cached prices (${r.count} items).` : `Prices updated: ${r.count} items.`)
    : `Error: ${r.error}`;
};
document.getElementById("chk").onclick = async () => {
  statusEl.textContent = "Checking Windows OCR…";
  const r = await window.api.checkOcr();
  if (r.ok && r.engine) {
    const langs = (r.langs && r.langs.length) ? r.langs.join(", ") : "profile languages";
    statusEl.textContent = `OCR OK — engine ready (${langs}).`;
  } else if (r.ok && !r.engine) {
    statusEl.textContent = "OCR engine unavailable — install a Windows OCR language pack (Settings > Language).";
  } else {
    statusEl.textContent = "OCR check failed: " + (r.error || "unknown");
  }
};
document.getElementById("bmc").onclick = () => {
  window.api.openExternal("https://buymeacoffee.com/iulian.icb");
};

// ---------- update (GitHub Releases) ----------
let updateInfo = null; // { latest, current, releaseUrl, assets } cand e disponibil
const updBanner = document.getElementById("updBanner");
const updBtn = document.getElementById("upd");

async function checkUpdateNow(silent) {
  try {
    const r = await window.api.checkUpdate();
    if (!r || !r.ok) { if (!silent) statusEl.textContent = "Update check failed."; return; }
    if (r.updateAvailable) {
      updateInfo = r;
      updBanner.hidden = false;
      updBanner.textContent = `⬆ Update available: v${r.latest} (you have v${r.current}) — click to open release`;
      updBtn.textContent = "Update now";
      if (!silent) statusEl.textContent = `Update available: v${r.latest}.`;
    } else {
      updateInfo = null;
      updBanner.hidden = true;
      updBtn.textContent = "Update";
      if (!silent) statusEl.textContent = r.reason === "no-releases" ? "No releases published yet." : "Up to date.";
    }
  } catch (e) {
    if (!silent) statusEl.textContent = "Update check failed.";
  }
}

updBanner.onclick = () => {
  if (updateInfo && updateInfo.releaseUrl) window.api.openExternal(updateInfo.releaseUrl);
};

updBtn.onclick = async () => {
  if (!updateInfo) { await checkUpdateNow(false); return; } // recheck daca nu stim inca
  statusEl.textContent = "Downloading update…";
  updBtn.disabled = true;
  const r = await window.api.doUpdate(); // assetul e ales in main process
  updBtn.disabled = false;
  if (r.ok) statusEl.textContent = `Update launched: ${r.name}. Close this version.`;
  else statusEl.textContent = "Update failed: " + r.error;
};
document.getElementById("dbg").onclick = () => {
  window.api.openDebug();
};

window.api.onScan((data) => {
  if (data.pricesAt) setPricesTime(data.pricesAt, data.pricesStale);
  render(data.rows, data.error);
});

// alerta sonora: item nou de la 1 Divine in sus
window.api.onAlert((d) => {
  ping();
  const n = (d && d.count) || 1;
  statusEl.textContent = n > 1
    ? `Alert: ${n} new items worth 1 Divine or more.`
    : "Alert: new item worth 1 Divine or more.";
});

// overlay pornit/oprit din hotkey global (Ctrl+Alt+O): sincronizam butonul din UI
window.api.onOverlayState((on) => {
  setOvlBtn(on);
  render(curRows, null);
  statusEl.textContent = on ? "Overlay on (hotkey)." : "Overlay off (hotkey).";
});

boot();
</script>
</body>
</html>
