<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: file: https://web.poecdn.com"
/>
<title>Path of Expedition — Rune Overlay</title>
<style>
  @font-face { font-family: "Norse"; src: url("fonts/Norse.otf") format("opentype"); font-weight: normal; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  /* pe fiecare rand din panou: DANGER + rezultatul combinatiei + ce rune merita duse mai departe (fara pret) */
  .r {
    position: absolute; left: 0;
    display: flex; align-items: flex-start; gap: 8px;
    width: max-content; max-width: calc(100% - 4px);
    font-family: var(--ui-font, "Segoe UI", Tahoma, sans-serif);
    font-size: 13px; white-space: nowrap;
    color: #ead9a8;
    background: rgba(6, 5, 4, .96);
    border: 1px solid rgba(214, 198, 156, .55);
    border-radius: 5px; padding: 4px 8px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .95);
    box-shadow: 0 1px 5px rgba(0, 0, 0, .7);
  }
  .dgr { flex-shrink: 0; margin-top: 1px; padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: bold; color: #fff; letter-spacing: .3px; }
  .dgr.d1 { background: #3f6d34; }
  .dgr.d2 { background: #5a7430; }
  .dgr.d3 { background: #7d7020; }
  .dgr.d4 { background: #9c5f18; }
  .dgr.d5 { background: #ad4018; }
  .dgr.d6 { background: #b02424; }
  .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; overflow: hidden; }
  .rw { font-size: 13px; font-weight: bold; color: #f2e6bd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw.multi { color: #d8c391; }
  .rw.unk { color: #9a8760; font-weight: normal; font-style: italic; }
  .sub { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp { color: #9fd39a; font-weight: bold; }
  .av { color: #e79a9a; font-weight: bold; }
  .muted { color: #9a8760; }
  .jk { color: #f2c14e; }
  #hint {
    position: absolute; left: 0; top: 0;
    font-family: var(--ui-font, "Segoe UI", Tahoma, sans-serif); font-size: 12px; color: #cbbc92;
    background: rgba(6, 5, 4, .9); border: 1px solid rgba(214, 198, 156, .35);
    border-radius: 5px; padding: 3px 9px; white-space: nowrap; max-width: calc(100% - 4px);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
  }
  /* legenda de orientare: apare DOAR cand exista randuri detectate (ca la overlay-ul
     de preturi), jos, ca sa nu acopere primul rand. Fara display in CSS ca sa nu
     copleseasca atributul hidden. */
  #legend {
    position: absolute; left: 0; bottom: 3px; z-index: 5;
    font-family: var(--ui-font, "Segoe UI", Tahoma, sans-serif); font-size: 10px; line-height: 1.45;
    color: #cbbc92; background: rgba(6, 5, 4, .92); border: 1px solid rgba(214, 198, 156, .35);
    border-radius: 5px; padding: 4px 8px; white-space: nowrap; max-width: calc(100% - 4px);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .95);
  }
  #legend b { color: #ead9a8; }
  .ch { color: #f2c14e; }
</style>
</head>
<body>
<div id="rows"></div>
<div id="hint" hidden></div>
<div id="legend" hidden data-i18n-html="runeovl.legend"><b>DANGER n/m</b> — monster danger of this row (higher = harder)<br><b>Spread → X</b> — keep 1 copy of X for later Remnants · <b>★</b> — jackpot / permanent Boon</div>
<script src="locales.js"></script>
<script src="i18n.js"></script>
<script src="fontui.js"></script>
<script src="runereader.js"></script>
<script src="runeoverlay.js"></script>
</body>
</html>
