<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
/>
<title>Debug — Path of Expedition</title>
<style>
  body { margin:0; background:#111827; color:#e5e7eb; font-family:Consolas,Segoe UI,monospace; font-size:12px; }
  .wrap { padding:12px; display:flex; flex-direction:column; gap:10px; height:100vh; box-sizing:border-box; }
  h1 { font-size:14px; margin:0; }
  .meta { color:#9ca3af; }
  .meta b { color:#e5e7eb; }
  .cols { display:flex; gap:10px; flex:1; min-height:0; }
  .col { flex:1; display:flex; flex-direction:column; min-width:0; }
  .col h2 { font-size:12px; color:#93c5fd; margin:0 0 4px; text-transform:uppercase; letter-spacing:.5px; }
  .box { background:#1f2937; border:1px solid #374151; border-radius:6px; padding:8px; overflow:auto; flex:1; white-space:pre-wrap; word-break:break-word; }
  .ocr { color:#fbbf24; }
  .logs { color:#9ca3af; }
  .empty { color:#6b7280; font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Debug</h1>
  <div id="meta" class="meta">Loding…</div>
  <div class="cols">
    <div class="col">
      <h2>OCR brut (ultimul scan)</h2>
      <div id="ocr" class="box ocr"><span class="empty">Nicio linie încă.</span></div>
    </div>
    <div class="col">
      <h2>Log app</h2>
      <div id="logs" class="box logs"><span class="empty">Fără loguri.</span></div>
    </div>
  </div>
</div>
<script>
const metaEl = document.getElementById("meta");
const ocrEl = document.getElementById("ocr");
const logsEl = document.getElementById("logs");

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}

async function refresh() {
  const d = await window.api.getDebug();
  const pricesAgo = d.pricesAt ? Math.round((Date.now() - d.pricesAt) / 1000) + "s în urmă" : "niciodată";
  metaEl.innerHTML =
    `Liga: <b>${esc(d.league || "?")}</b> &nbsp;|&nbsp; Regiune: <b>${d.region ? "setată" : "nesetată"}</b> &nbsp;|&nbsp; Prețuri: <b>${pricesAgo}</b>`;

  ocrEl.innerHTML = d.ocrLines.length
    ? d.ocrLines.map((t, i) => `${i + 1}. ${esc(t)}`).join("\n")
    : '<span class="empty">Nicio linie OCR (scan pornit încă?).</span>';

  logsEl.innerHTML = d.logs.length
    ? d.logs.slice().reverse().map(esc).join("\n")
    : '<span class="empty">Fără loguri.</span>';
}

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
