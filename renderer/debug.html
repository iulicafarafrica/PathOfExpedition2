<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
/>
<title>Debug — Path of Expedition</title>
<style>
  :root { --parch:#d9c9a3; --ink:#3a2c18; --ink-soft:#5c4a30; --line:#8a6f47; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,"Times New Roman",serif; color:var(--ink);
    background:radial-gradient(ellipse at 50% 0%, #e7d9b6 0%, #cbb890 60%, #b49b6e 100%); }
  .wrap { padding:12px 14px; display:flex; flex-direction:column; gap:10px; height:100vh; }
  h1 { font-size:16px; margin:0; text-align:center; }
  .meta { color:var(--ink-soft); font-size:13px; text-align:center; }
  .meta b { color:var(--ink); }
  .cols { display:flex; gap:10px; flex:1; min-height:0; }
  .col { flex:1; display:flex; flex-direction:column; min-width:0; }
  .col h2 { font-size:12px; color:var(--ink-soft); margin:0 0 4px; text-transform:uppercase; letter-spacing:.5px; }
  .box {
    background:#e4d6b4; border:1px solid var(--line); border-radius:3px;
    padding:8px; overflow:auto; flex:1; white-space:pre-wrap; word-break:break-word;
    font-family:Consolas,monospace; font-size:12px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .ocr { color:#5a3e12; }
  .logs { color:#4a3c28; }
  .empty { color:var(--ink-soft); font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Debug</h1>
  <div id="meta" class="meta">Loading…</div>
  <div class="cols">
    <div class="col">
      <h2>Raw OCR (last scan)</h2>
      <div id="ocr" class="box ocr"><span class="empty">No lines yet.</span></div>
    </div>
    <div class="col">
      <h2>App log</h2>
      <div id="logs" class="box logs"><span class="empty">No logs.</span></div>
    </div>
  </div>
</div>
<script>
const metaEl = document.getElementById("meta");
const ocrEl = document.getElementById("ocr");
const logsEl = document.getElementById("logs");

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}

async function refresh() {
  const d = await window.api.getDebug();
  const pricesAgo = d.pricesAt ? Math.round((Date.now() - d.pricesAt) / 1000) + "s ago" : "never";
  metaEl.innerHTML =
    `League: <b>${esc(d.league || "?")}</b> &nbsp;|&nbsp; Region: <b>${d.region ? "set" : "not set"}</b> &nbsp;|&nbsp; Prices: <b>${pricesAgo}</b>`;

  ocrEl.innerHTML = d.ocrLines.length
    ? d.ocrLines.map((t, i) => `${i + 1}. ${esc(t)}`).join("\n")
    : '<span class="empty">No OCR lines (scan not started yet?).</span>';

  logsEl.innerHTML = d.logs.length
    ? d.logs.slice().reverse().map(esc).join("\n")
    : '<span class="empty">No logs.</span>';
}

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
